version = 1

[pipeline]
steps = ["trim", "assemble", "polish"]

[project]
root = "."

[runtime]
skip_existing = true
stop_on_error = true

[paths]
raw_reads = "data/{barcode}"
trimmed_reads = "data/trimmed/{barcode}_porechop"
assembly_dir = "data/assembly/{barcode}_autocycler"
assembly_fasta = "data/assembly/{barcode}_autocycler/consensus_assembly.fasta"
combined_trimmed_fastq = "data/assembly/{barcode}_autocycler/reads/{barcode}.trimmed.combined.fastq.gz"
assembly_subsampled_reads_dir = "data/assembly/{barcode}_autocycler/subsampled_reads"
assembly_input_assemblies_dir = "data/assembly/{barcode}_autocycler/assemblies"
polish_dir = "data/polish/{barcode}_medaka"
polished_fasta = "data/polish/{barcode}_medaka/consensus.fasta"
circularization_dir = "data/circularized/{barcode}_circlator"
circularization_reads_dir = "data/circularized/{barcode}_circlator/00_reads"
combined_trimmed_reads = "data/circularized/{barcode}_circlator/00_reads/{barcode}.trimmed.combined.fastq.gz"
circlator_output_dir = "data/circularized/{barcode}_circlator/01_circlator"
circularized_fasta = "data/circularized/{barcode}_circlator/01_circlator/06.fixstart.fasta"
circlator_circularize_log = "data/circularized/{barcode}_circlator/01_circlator/04.merge.circularise.log"

[tools.porechop]
executable = "porechop"
extra_args = []

[tools.autocycler]
executable = "autocycler"
genome_size = "auto"
read_type = "ont_r10"
subsample_count = 4
assemblers = ["flye", "raven", "miniasm"]
subsample_extra_args = []
helper_extra_args = ["--min_depth_rel", "0.1"]
compress_extra_args = []
cluster_extra_args = []
trim_extra_args = []
resolve_extra_args = []
combine_extra_args = []

[tools.medaka]
executable = "medaka_consensus"
extra_args = ["--bacteria"]

[tools.circlator]
executable = "circlator"
extra_args = ["--verbose", "--genes_fa", "mergibacter_dnaA_ref.fasta"]
